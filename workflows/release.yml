name: Download-Paket

# Erzeugt ein fertiges ZIP der App zum Herunterladen.
#
# Zwei Wege:
#   1. Actions-Tab -> "Download-Paket" -> "Run workflow": das ZIP haengt danach
#      unten am Lauf als Artefakt (bleibt 90 Tage verfuegbar).
#   2. Ein Tag der Form v1.0.0 pushen: es entsteht zusaetzlich ein Release mit
#      dem ZIP als Anhang, das dauerhaft unter "Releases" liegt.
#
#      git tag v1.0.0 && git push origin v1.0.0

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write        # noetig, um ein Release anzulegen

jobs:
  paket:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Version bestimmen
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "name=$(date +%Y-%m-%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Tests vor dem Paketieren
        run: |
          python app.py --port 8765 --db ci.db --no-browser &
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:8765/api/einstellungen >/dev/null && break
            sleep 0.5
          done
          python test_api.py

      - name: Paket bauen
        run: |
          rm -f ci.db
          mkdir -p paket/zeiterfassung
          cp -r app.py static README.md start.sh start.bat test_api.py paket/zeiterfassung/
          cd paket
          zip -qr "../zeiterfassung-${{ steps.version.outputs.name }}.zip" zeiterfassung
          cd ..
          unzip -l "zeiterfassung-${{ steps.version.outputs.name }}.zip"

      - name: Als Artefakt anhaengen
        uses: actions/upload-artifact@v7
        with:
          name: zeiterfassung-${{ steps.version.outputs.name }}
          path: zeiterfassung-${{ steps.version.outputs.name }}.zip
          if-no-files-found: error
          retention-days: 90

      - name: Release anlegen (nur bei einem Tag)
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "zeiterfassung-${{ steps.version.outputs.name }}.zip" \
            --title "Zeiterfassung ${GITHUB_REF_NAME}" \
            --notes "Entpacken und \`python3 app.py\` starten. Details in der README." \
            --repo "${GITHUB_REPOSITORY}"
