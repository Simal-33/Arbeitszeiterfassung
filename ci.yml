name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]

    steps:
      # v6 laeuft auf Node 24 – v4 loest die Deprecation-Warnung aus
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Syntax pruefen
        run: python -m compileall -q app.py test_api.py

      - name: Server starten
        run: |
          python app.py --port 8765 --db ci.db --no-browser &
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:8765/api/einstellungen >/dev/null && exit 0
            sleep 0.5
          done
          echo "Server ist nicht gestartet"; exit 1

      - name: API-Tests
        run: python test_api.py
