name: Pages

# Veroeffentlicht den Ordner static/ als Website unter
# https://simal-33.github.io/Arbeitszeiterfassung/
#
# "enablement: true" schaltet GitHub Pages beim ersten Lauf selbst ein –
# es muss nichts von Hand unter Settings -> Pages eingestellt werden.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nie zwei Veroeffentlichungen gleichzeitig
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Ordner static/ als Website-Paket packen
        uses: actions/upload-pages-artifact@v3
        with:
          path: static

      - id: deployment
        uses: actions/deploy-pages@v4
